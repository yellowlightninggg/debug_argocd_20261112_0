apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-deployment
  namespace: server1-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1-label
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: server1-service
  namespace: server1-namespace
spec:
  selector:
    app: server1-label
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
